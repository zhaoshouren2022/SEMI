site_name: SEMI笔记
site_description: 半导体 SEMI 协议学习笔记
site_url: https://zhaoshouren2022.github.io/SEMI/

theme:
  name: material
  language: zh
  font: false
  icon:
    logo: material/book-open-variant
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换到暗色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - plantuml_markdown:
      servers:
        - https://www.plantuml.com/plantuml
      format: svg
      cachedir: .plantuml-cache
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tilde

plugins:
  - search

extra_javascript:
  - assets/javascripts/mermaid.min.js
  - assets/javascripts/mermaid-init.js

nav:
